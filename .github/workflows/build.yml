name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codello/setup-lilypond@main
        with:
          lilypond-version: 2.24
      - name: Install fonts
        run: mkdir -p ~/.local/share/fonts && cp ./lilypond-lib/fonts/* ~/.local/share/fonts/ && fc-cache -f
      - name: Compile scores
        run: make
      - name: Generate index
        run: |
          cd output
          echo '<html><head><meta charset="utf-8"><title>Scores</title></head><body><h1>Scores</h1><ul>' > index.html
          for f in *.pdf; do
            echo "<li><a href=\"$f\">$f</a></li>" >> index.html
          done
          echo '</ul></body></html>' >> index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
